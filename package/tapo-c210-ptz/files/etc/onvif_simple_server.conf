model=Tapo C210 v2 OpenIPC
manufacturer=TP-Link / OpenIPC
port=8080
ptz=1
# Command mappings triggered by Frigate:
move_left=/usr/sbin/ptz-controller step -50 0
move_right=/usr/sbin/ptz-controller step 50 0
move_up=/usr/sbin/ptz-controller step 0 30
move_down=/usr/sbin/ptz-controller step 0 -30
move_stop=/usr/sbin/ptz-controller stop
move_preset=/usr/sbin/ptz-controller goto
